- id: public-email
  platform: generic
  title: Reduce public email exposure
  description: Limit where your personal email address is displayed publicly.
  finding_types:
    - EMAIL_ADDRESS
  steps:
    - Remove the personal address from public profile fields and pages you control.
    - Use a separate public contact address where a public address is necessary.
    - Review search-engine results for copies on pages you control and request refreshes where available.
  effort_minutes: 15
  expected_score_gain: 5
- id: public-phone
  platform: generic
  title: Reduce public phone exposure
  description: Remove or restrict personal phone details on public pages you control.
  finding_types:
    - PHONE_NUMBER
  steps:
    - Remove the personal number from public profile and contact fields where it is not required.
    - Review account privacy and discoverability settings for phone-number lookup.
    - Prefer a dedicated business contact channel when public contact is necessary.
  effort_minutes: 20
  expected_score_gain: 7
- id: public-identity
  platform: generic
  title: Review public identity details
  description: Minimize personal identity details that are not needed on public profiles.
  finding_types:
    - PERSON
    - ORGANIZATION
  steps:
    - Review public profile text and remove identity details that are not needed.
    - Check whether the same details appear on other pages you control.
    - Adjust profile visibility where the service provides that option.
  effort_minutes: 15
  expected_score_gain: 4
- id: public-birth-date
  platform: generic
  title: Restrict birth-date details
  description: Remove birth-date details from public profile fields and pages.
  finding_types:
    - DOB_DATE
    - DATE_TIME
  steps:
    - Remove full birth dates from public profile fields and posts you control.
    - Review audience settings for older posts that include date details.
    - Keep required account-recovery information private to the service.
  effort_minutes: 15
  expected_score_gain: 8
- id: public-location
  platform: generic
  title: Reduce location detail
  description: Limit precise location details exposed by public profiles or posts.
  finding_types:
    - LOCATION
    - US_ZIP_CODE
  steps:
    - Remove home-address or precise-location details from public profile content.
    - Review public posts and photo metadata for location details before sharing.
    - Use broad regional descriptions instead of precise location when appropriate.
  effort_minutes: 20
  expected_score_gain: 6
- id: public-handle
  platform: generic
  title: Review public account identifiers
  description: Reduce unnecessary links between public accounts.
  finding_types:
    - SOCIAL_HANDLE
  steps:
    - Review public bios and remove account links that you do not want connected.
    - Consider using different public identifiers for accounts with different audiences.
    - Check profile discoverability settings on services you control.
  effort_minutes: 20
  expected_score_gain: 4
- id: public-financial-identifiers
  platform: generic
  title: Remove sensitive financial identifiers
  description: Remove financial identifiers from pages that are publicly accessible.
  finding_types:
    - CREDIT_CARD
    - IBAN_CODE
    - US_SSN
  steps:
    - Remove the identifier from public content and contact the site owner if you cannot edit it.
    - If a payment-card number was genuinely exposed, contact the issuer using its official channel.
    - If a government identifier was genuinely exposed, follow the issuing authority's identity-protection guidance.
  effort_minutes: 30
  expected_score_gain: 10
