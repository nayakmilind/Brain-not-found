[project]
name = "privacy-shield-ai"
version = "0.1.0"
description = "Consent-first personal digital footprint risk intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "cryptography>=50,<51",
    "dnspython>=2.7,<3",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "Faker>=37,<39",
    "httpcore>=1,<2",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "PyYAML>=6,<7",
    "pypdf>=5.4,<7",
    "pydantic-settings>=2.7,<3",
    "python-docx>=1.1,<2",
    "redis>=5.2,<7",
    "reportlab>=4.3,<5",
    "selectolax>=0.3.29,<1",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "structlog>=25.1,<26",
    "uvicorn[standard]>=0.34,<1",
    "presidio-analyzer>=2.2.360,<3",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "phonenumbers>=8.13,<10",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "hypothesis>=6.100,<7",
    "mypy>=1.15,<2",
    "pip-audit>=2.8,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-PyYAML>=6,<7",
    "types-reportlab>=4.2,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py", "app/core/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
